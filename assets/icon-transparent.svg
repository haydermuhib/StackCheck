<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 90 352 340" width="100%" height="100%">
  <defs>
    <!-- Layer 1 (Top Glass / Electric Cyan) -->
    <linearGradient id="t-l1-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="t-l1-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="t-l1-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <!-- Layer 2 (Emerald / Mint) -->
    <linearGradient id="t-l2-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="t-l2-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="t-l2-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Layer 3 (Electric Violet) -->
    <linearGradient id="t-l3-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="t-l3-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="t-l3-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Layer 4 (Bottom - Royal Indigo) -->
    <linearGradient id="t-l4-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="t-l4-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="t-l4-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="t-check-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <filter id="t-neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="t-layer-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.6"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Orbital Data Flow Trails -->
  <path d="M 100 240 C 90 150, 410 140, 420 240 C 430 340, 110 350, 100 240" 
        fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5,9" opacity="0.4"/>
  <circle cx="125" cy="180" r="4.5" fill="#38bdf8" filter="url(#t-neon-glow)"/>
  <circle cx="410" cy="210" r="3.5" fill="#a855f7" opacity="0.8"/>
  <circle cx="140" cy="315" r="4" fill="#34d399" filter="url(#t-neon-glow)"/>

  <!-- LAYER 4 (INDIGO) -->
  <g filter="url(#t-layer-shadow)">
    <path d="M 136 340 L 256 394 L 256 410 L 136 356 Z" fill="url(#t-l4-left)"/>
    <path d="M 256 394 L 376 340 L 376 356 L 256 410 Z" fill="url(#t-l4-right)"/>
    <path d="M 256 286 L 376 340 L 256 394 L 136 340 Z" fill="url(#t-l4-top)"/>
    <path d="M 256 286 L 376 340 L 256 394 L 136 340 Z" fill="none" stroke="#a5b4fc" stroke-width="1.2" opacity="0.5"/>
  </g>
  <line x1="160" y1="315" x2="160" y2="340" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="352" y1="315" x2="352" y2="340" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- LAYER 3 (VIOLET) -->
  <g filter="url(#t-layer-shadow)">
    <path d="M 136 285 L 256 339 L 256 355 L 136 301 Z" fill="url(#t-l3-left)"/>
    <path d="M 256 339 L 376 285 L 376 301 L 256 355 Z" fill="url(#t-l3-right)"/>
    <path d="M 256 231 L 376 285 L 256 339 L 136 285 Z" fill="url(#t-l3-top)"/>
    <path d="M 256 231 L 376 285 L 256 339 L 136 285 Z" fill="none" stroke="#c4b5fd" stroke-width="1.2" opacity="0.5"/>
  </g>
  <line x1="160" y1="260" x2="160" y2="285" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="352" y1="260" x2="352" y2="285" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- LAYER 2 (MINT EMERALD) -->
  <g filter="url(#t-layer-shadow)">
    <path d="M 136 230 L 256 284 L 256 300 L 136 246 Z" fill="url(#t-l2-left)"/>
    <path d="M 256 284 L 376 230 L 376 246 L 256 300 Z" fill="url(#t-l2-right)"/>
    <path d="M 256 176 L 376 230 L 256 284 L 136 230 Z" fill="url(#t-l2-top)"/>
    <path d="M 256 176 L 376 230 L 256 284 L 136 230 Z" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.6"/>
  </g>
  <line x1="160" y1="205" x2="160" y2="230" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="352" y1="205" x2="352" y2="230" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- LAYER 1 (CYAN APEX) -->
  <g filter="url(#t-layer-shadow)">
    <path d="M 136 175 L 256 229 L 256 245 L 136 191 Z" fill="url(#t-l1-left)"/>
    <path d="M 256 229 L 376 175 L 376 191 L 256 245 Z" fill="url(#t-l1-right)"/>
    <path d="M 256 121 L 376 175 L 256 229 L 136 175 Z" fill="url(#t-l1-top)"/>
    <path d="M 256 133 L 350 175 L 256 217 L 162 175 Z" fill="#ffffff" opacity="0.18"/>
    <path d="M 256 121 L 376 175 L 256 229 L 136 175 Z" fill="none" stroke="#bae6fd" stroke-width="1.8" opacity="0.85"/>
  </g>
  <line x1="148" y1="175" x2="256" y2="227" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>

  <!-- CHECKMARK -->
  <path d="M 198 168 L 242 202 L 320 132" fill="none" stroke="#000000" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <path d="M 198 165 L 242 199 L 320 129" fill="none" stroke="#38bdf8" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" filter="url(#t-neon-glow)" opacity="0.9"/>
  <path d="M 198 165 L 242 199 L 320 129" fill="none" stroke="url(#t-check-grad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 198 165 L 242 199 L 320 129" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <circle cx="320" cy="129" r="3.5" fill="#ffffff" filter="url(#t-neon-glow)"/>
</svg>
