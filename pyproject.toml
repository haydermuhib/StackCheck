[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stackcheck"
version = "0.1.2"
description = "Job market tech stack intelligence engine, scraping analytics, and interactive TUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "StackCheck Team" }
]
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "rich>=13.7.0",
    "curl_cffi>=0.16.0",
    "click>=8.1.7",
    "pydantic>=2.6.0",
    "httpx>=0.28.1",
]

[project.scripts]
stackcheck = "stackcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "graphifyy>=0.9.75",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
