name: Build & Release Standalone Desktop Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: StackCheck-windows-x64.exe
            dist_file: dist/StackCheck.exe
          - os: macos-latest
            artifact_name: StackCheck-macos-arm64
            dist_file: dist/StackCheck
          - os: ubuntu-latest
            artifact_name: StackCheck-linux-x64
            dist_file: dist/StackCheck

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller pillow

      - name: Build Standalone Executable
        run: |
          python build_app.py

      - name: Rename Artifact for Release
        shell: bash
        run: |
          mkdir -p release_assets
          cp "${{ matrix.dist_file }}" "release_assets/${{ matrix.artifact_name }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/${{ matrix.artifact_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_downloads
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_downloads/*
          draft: false
          prerelease: false
          generate_release_notes: true
