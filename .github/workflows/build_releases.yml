name: Build & Release Standalone Desktop Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: StackCheck-windows-x64.exe
            dist_file: dist/StackCheck.exe
          - os: macos-latest
            artifact_name: StackCheck-macos-arm64
            dist_file: dist/StackCheck
          - os: ubuntu-latest
            artifact_name: StackCheck-linux-x64
            dist_file: dist/StackCheck

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller pillow pytest

      - name: Run Test Suite
        run: |
          pytest tests/

      - name: Build Standalone Executable
        run: |
          python build_app.py

      - name: Binary Sanity & Size Verification
        shell: bash
        run: |
          echo "=== 1. Checking Binary Existence & Size ==="
          ls -lh "${{ matrix.dist_file }}"
          FILESIZE=$(wc -c < "${{ matrix.dist_file }}" | tr -d ' ')
          echo "Binary size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 30000000 ]; then
            echo "❌ ERROR: Executable is suspiciously small ($FILESIZE bytes). Packaging may have failed or truncated!"
            exit 1
          fi
          echo "✔ Binary size sanity check passed ($FILESIZE bytes)."

      - name: Binary Smoke & Runtime Sanity Test
        shell: bash
        run: |
          echo "=== 2. Testing Execution & Runtime Environment ==="
          chmod +x "${{ matrix.dist_file }}" || true
          
          # 1. Version sanity check
          VERSION_OUT=$("${{ matrix.dist_file }}" --version)
          echo "$VERSION_OUT"
          echo "$VERSION_OUT" | grep -E "StackCheck v[0-9]+" || { echo "❌ Version string sanity check failed"; exit 1; }

          # 2. Help rendering sanity check
          "${{ matrix.dist_file }}" --help

          # 3. Status command sanity check
          "${{ matrix.dist_file }}" status

          # 4. Deep component check (NumPy, Pandas, Streamlit, Web App C-extensions)
          "${{ matrix.dist_file }}" check

          # 5. Live Localhost Web Server Boot & Probe
          echo "=== 3. Testing Live Localhost Server Boot & HTTP Healthcheck ==="
          "${{ matrix.dist_file }}" -d

          SERVER_OK=false
          for i in {1..25}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 3 http://127.0.0.1:8501 2>/dev/null)
            if [ "$HTTP_CODE" != "200" ]; then
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 3 http://localhost:8501 2>/dev/null)
            fi
            if [ "$HTTP_CODE" = "200" ]; then
              SERVER_OK=true
              echo "Server responded with HTTP $HTTP_CODE after ${i}s"
              break
            fi
            sleep 1
          done

          if [ "$SERVER_OK" != "true" ]; then
            echo "❌ ERROR: Localhost web server failed to return HTTP 200 within 25s! Last HTTP code: $HTTP_CODE"
            cat "$HOME/.stackcheck/stackcheck.log" 2>/dev/null || true
            "${{ matrix.dist_file }}" stop || true
            exit 1
          fi
          echo "✔ Localhost web dashboard successfully booted and responded with HTTP 200 OK!"

          # 6. Verify status reports active server
          "${{ matrix.dist_file }}" status

          # 7. Cleanly terminate server and release port
          "${{ matrix.dist_file }}" stop
          echo "✔ All binary sanity & live localhost tests passed cleanly!"

      - name: Rename Artifact for Release
        shell: bash
        run: |
          mkdir -p release_assets
          cp "${{ matrix.dist_file }}" "release_assets/${{ matrix.artifact_name }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/${{ matrix.artifact_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_downloads
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_downloads/*
          draft: false
          prerelease: false
          generate_release_notes: true
